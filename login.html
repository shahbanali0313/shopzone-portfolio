<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopZone</title>

    <link rel="stylesheet" href="Auth.css">
</head>
<body>

<div class="auth-container">

    <h1>ShopZone</h1>

    <h2>Login</h2>
    <div class="demo-notice">
    <strong>Educational Project</strong><br>
    This is a frontend demo website.<br>
    Do NOT enter your real email or password.
    Data is stored only in your browser (LocalStorage).
</div>

    <form id="loginForm">

        <div class="input-group">
            <label>Email</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required>
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <p class="switch-page">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </p>

</div>

<script src="Auth.js"></script>

</body>
</html>
